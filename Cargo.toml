[package]
name = "Hconfig"
version = "3.0.0"
authors = ["Hyultis <hyultis@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/hyultis/rust_Hconfig"
keywords = ["json", "config", "path-config", "settings"]
categories = ["config"]
description = "Json configuration file manager"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# the package name "Hconfig" is fixed on crates.io; the library follows the Rust naming : `use hconfig::...`
[lib]
name = "hconfig"

[dependencies]
tinyjson = "2.5"
thiserror = "2.0"
